# Formeln: Kontrast-/Paradox-Einstieg + Mythos-Bruch (#9) + Heute-Bezug (#15)
# Fakten geprüft mit de.wikipedia.org/wiki/Kartoffelbefehl (06.11.2026)
# Ältere Cartoon-Fassung: .build/video-cartoon-v2.yaml
title: "Friedrich der Große und die bewachten Kartoffeln"
style: doku
format: short
voice: de-thorsten-low   # Entwurfsstimme (CC0). Eigene Aufnahmen in aufnahme/ ersetzen sie automatisch.
speed: 1.0
music: {score: dark, motif: flute, tempo: 66}   # komponierte Filmmusik, Flöte = Friedrichs Instrument
music_volume: 0.045
crossfade: 0.45

meta:
  titles:
    - "Friedrich der Große: Der König, der seine Kartoffeln stehlen ließ"
    - "Kartoffelbefehl: Was an der Legende wirklich dran ist"
    - "Warum Friedrich der Große Kartoffeln bewachen ließ"
  description: |
    Friedrich der Große soll ein Kartoffelfeld bewachen lassen haben, damit die Bauern es bestehlen. Was ist dran?

    Aus Preußen sind fünfzehn sogenannte Kartoffelbefehle bekannt, der berühmteste vom 24. März 1756 für Schlesien. Die Geschichte mit den Wachen ist dagegen nicht belegt. In Frankreich erzählt man sie fast genauso über den Apotheker Antoine Parmentier.

    Sicher ist: Auf Friedrichs Grab in Sanssouci liegen bis heute Kartoffeln.

    Legende oder Wahrheit? Schreib's in die Kommentare.

    #geschichte #preußen #friedrichdergroße
  sources:
    - "Kartoffelbefehl – de.wikipedia.org/wiki/Kartoffelbefehl (abgerufen 06.11.2026)"
    - "Antoine Parmentier – de.wikipedia.org/wiki/Antoine_Parmentier (abgerufen 06.11.2026)"
    - "Literatur: Kurt Winkler (Hrsg.): König & Kartoffel. Friedrich der Große und die preußischen Tartuffoli, 2012"
  pinned_comment: "Fünfzehn Befehle. Aber für die Geschichte mit den Wachen gibt es keinen einzigen Beleg. Glaubst du sie trotzdem?"
  tags: [Geschichte, Preußen, Friedrich der Große, Kartoffelbefehl, Alter Fritz, Doku]
  keywords: "Friedrich der Große,Kartoffelbefehl,Preußen"
  thumbnail_time: 0.6
  notes: |
    Alle Bilder: gemeinfrei (Public Domain / CC0), Wikimedia Commons – Nachweise unten.
    KI-Kennzeichnung: nicht nötig (historische Gemälde, keine KI-Bilder).
    Stimme: Entwurfsstimme. Für Upload unbedingt eigene Stimme (aufnahme-skript.md) oder bessere Sprecherstimme.

scenes:
  - text: "Dieser König ließ ein Kartoffelfeld von Soldaten bewachen."
    hit: true
    highlight: [Soldaten]
    visual:
      - {type: photo, src: assets/Robert_Warthmüller_-_Der_König_überall_1886_.jpg, from: [0.355, 0.42, 1.55], to: [0.36, 0.40, 1.75]}
      - {type: dust, n: 35}

  - text: "Nicht, um Diebe fernzuhalten. Sondern um sie anzulocken."
    visual:
      - {type: photo, src: assets/Jean-François_Millet_-_Potato_Planters_-_Google_Art_Project.jpg, from: [0.35, 0.5, 1.0], to: [0.45, 0.48, 1.12], fallback: {src: assets/Robert_Warthmüller_-_Der_König_überall_1886_.jpg, from: [0.62, 0.62, 1.9], to: [0.6, 0.7, 2.1]}}
      - {type: dust, n: 35}

  - text: "Preußen im 18. Jahrhundert. Missernten und Hungersnöte treffen das Land immer wieder."
    say: "Preußen im achtzehnten Jahrhundert. Missernten und Hungersnöte treffen das Land immer wieder."
    visual:
      - {type: photo, src: assets/Van_Gogh_-_Die_Kartoffelesser.jpg, from: [0.25, 0.5, 1.05], to: [0.4, 0.5, 1.15]}
      - {type: date, text: "Preußen · 18. Jahrhundert", y: 0.09, at: 0.2}

  - text: "Dabei wächst die Lösung längst in Europa: die Kartoffel, ursprünglich aus den Anden."
    highlight: [Kartoffel]
    visual:
      - {type: photo, src: assets/Robert_Warthmüller_-_Der_König_überall_1886_.jpg, from: [0.6, 0.86, 2.4], to: [0.53, 0.66, 2.0]}

  - text: "Doch die Bauern trauen ihr nicht. Sie gilt als Viehfutter, und kaum jemand weiß, wie man sie anbaut."
    visual:
      - {type: photo, src: assets/Van_Gogh_-_Die_Kartoffelesser.jpg, from: [0.62, 0.45, 1.3], to: [0.7, 0.42, 1.45]}

  - text: "Friedrich der Große greift durch. Fünfzehn solcher Erlasse sind bekannt. Der berühmteste stammt vom 24. März 1756."
    say: "Friedrich der Große greift durch. Fünfzehn solcher Erlasse sind bekannt. Der berühmteste stammt vom vierundzwanzigsten März siebzehnhundertsechsundfünfzig."
    highlight: [Fünfzehn]
    visual:
      - {type: photo, src: assets/Friedrich_der_Große_1781_or_1786_-_Google_Art_Project.jpg, from: [0.5, 0.42, 1.0], to: [0.5, 0.36, 1.18]}
      - {type: lower, text: "Friedrich II.", sub: "König von Preußen · 1740–1786", y: 0.58, at: 0.4}
      - {type: date, text: "24. März 1756", y: 0.09, at_word: berühmteste}

  - text: "Doch Befehle allein überzeugen keinen Bauern. Und hier beginnt die Legende."
    visual:
      - {type: photo, src: assets/Robert_Warthmüller_-_Der_König_überall_1886_.jpg, from: [0.2, 0.45, 1.0], to: [0.75, 0.45, 1.0]}
      - {type: title, text: "Die Legende", y: 0.4, size: 110, at_word: Legende}

  - text: "Der König lässt auf seinen Gütern Kartoffeln anbauen und von Soldaten bewachen."
    transition: flash
    hit: true
    visual:
      - {type: photo, src: assets/Robert_Warthmüller_-_Der_König_überall_1886_.jpg, from: [0.4, 0.4, 1.6], to: [0.42, 0.36, 1.8]}

  - text: "Die Bauern werden neugierig. Was so streng bewacht wird, muss wertvoll sein."
    visual:
      - {type: photo, src: assets/Robert_Warthmüller_-_Der_König_überall_1886_.jpg, from: [0.78, 0.42, 1.5], to: [0.7, 0.45, 1.65]}

  - text: "Nachts schleichen sie auf die Felder und stehlen die Knollen. Die Wachen haben Befehl, wegzusehen."
    heartbeat: true
    visual:
      - {type: photo, src: assets/Jean-François_Millet_-_Potato_Planters_-_Google_Art_Project.jpg, from: [0.6, 0.55, 1.35], to: [0.5, 0.6, 1.55], fallback: {src: assets/Van_Gogh_-_Die_Kartoffelesser.jpg, from: [0.5, 0.25, 1.7], to: [0.5, 0.3, 1.9]}}

  - text: "Ein genialer Plan. Nur: Belegt ist er nicht."
    transition: flash
    hit: true
    visual:
      - {type: photo, src: assets/Friedrich_der_Große_1781_or_1786_-_Google_Art_Project.jpg, from: [0.5, 0.3, 1.9], to: [0.5, 0.28, 2.1]}
      - {type: title, text: "Nicht belegt", y: 0.4, size: 100, at_word: Belegt}

  - text: "Fast dieselbe Geschichte erzählt man in Frankreich über den Apotheker Antoine Parmentier."
    visual:
      - {type: photo, src: assets/Portret_van_Antoine-Augustin_Parmentier_RP-P-1910-5037.jpg, fit: contain, from: [0.5, 0.45, 1.0], to: [0.5, 0.4, 1.08], fallback: {src: assets/Robert_Warthmüller_-_Der_König_überall_1886_.jpg, from: [0.52, 0.42, 1.0], to: [0.56, 0.42, 1.1]}}
      - {type: lower, text: "Antoine Parmentier", sub: "Apotheker · 1737–1813", y: 0.6, at_word: Apotheker}

  - text: "Sicher ist nur eines: Bis heute legen Besucher Kartoffeln auf Friedrichs Grab in Sanssouci."
    highlight: [Sanssouci]
    visual:
      - {type: photo, src: assets/Robert_Warthmüller_-_Der_König_überall_1886_.jpg, from: [0.66, 0.9, 2.6], to: [0.6, 0.88, 2.9]}
      - {type: date, text: "Sanssouci · Potsdam", y: 0.09, at_word: Grab}

  - text: "Legende oder Wahrheit? Was glaubst du?"
    visual:
      - {type: photo, src: assets/Robert_Warthmüller_-_Der_König_überall_1886_.jpg, from: [0.36, 0.42, 1.75], to: [0.355, 0.42, 1.55]}
      - {type: title, text: "Legende\noder Wahrheit?", y: 0.17, size: 96}
      - {type: dust, n: 35}

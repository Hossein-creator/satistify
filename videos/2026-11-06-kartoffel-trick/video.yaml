title: "Friedrich der Große und die bewachten Kartoffeln"
style: doku
format: short
voice: de-thorsten-low   # Entwurfsstimme (CC0). Eigene Aufnahmen in aufnahme/ ersetzen sie automatisch.
speed: 1.0
era: barock         # Thema: Preußen 1740–1786 -> Musik, Bilder und Figuren aus dieser Zeit
music: {score: epoche, era: barock, key: D, drop_scene: 1}   # Barock: Flöte (Friedrich war Flötist), Cembalo, Streicher, Pauken
music_db: 21        # Musik 21 dB unter der Stimme (Nutzer: leiser), beim Sprechen zusätzlich abgesenkt (duck)
duck: 0.5
beat_bump: 0.006    # Bild pulsiert dezent mit der Pauke
handheld: 0.7       # Handkamera-Bewegung auf allen Bildern
leaks: 0.10         # leichter Lichteinfall bei Szenenwechseln
flicker: 0.025      # Projektor-Flackern
crossfade: 0.4
mood: cinematic     # Grundfarbe (Teal & Orange); pro Szene mit mood: überschreiben
bloom: 0.35         # helle Stellen glühen leicht

meta:
  titles:
    - "Friedrich der Große wollte, dass man ihn bestiehlt"
    - "Der Kartoffel-Trick des Alten Fritz: Legende oder Wahrheit?"
    - "Warum Friedrich der Große Kartoffeln bewachen ließ"
  description: |
    Friedrich der Große soll ein Kartoffelfeld bewachen lassen haben, damit die Bauern es bestehlen. Was ist dran?

    Aus Preußen sind fünfzehn sogenannte Kartoffelbefehle bekannt, der berühmteste vom 24. März 1756 für Schlesien. Die Geschichte mit den Wachen ist dagegen nicht belegt. In Frankreich erzählt man sie fast genauso über den Apotheker Antoine Parmentier.

    Sicher ist: Auf Friedrichs Grab in Sanssouci liegen bis heute Kartoffeln.

    Legende oder Wahrheit? Schreib's in die Kommentare.

    #geschichte #preußen #friedrichdergroße
  sources:
    - "Kartoffelbefehl – de.wikipedia.org/wiki/Kartoffelbefehl (abgerufen 06.11.2026)"
    - "Antoine Parmentier – de.wikipedia.org/wiki/Antoine_Parmentier (abgerufen 06.11.2026)"
    - "Literatur: Kurt Winkler (Hrsg.): König & Kartoffel. Friedrich der Große und die preußischen Tartuffoli, 2012"
  pinned_comment: "Fünfzehn Befehle. Aber für die Geschichte mit den Wachen gibt es keinen einzigen Beleg. Glaubst du sie trotzdem?"
  tags: [Geschichte, Preußen, Friedrich der Große, Kartoffelbefehl, Alter Fritz, Doku]
  keywords: "Friedrich der Große,Kartoffelbefehl,Preußen"
  thumbnail_time: 0.5
  notes: |
    Alle Bilder: gemeinfrei (Public Domain / CC0), Wikimedia Commons – Nachweise unten.
    Musik: eigene Komposition im Barock-Stil (FluidR3-Soundfont, MIT) – kein Content-ID-Risiko.
    Alternative: video_ohne_musik.mp4 hochladen und einen Trend-Sound direkt in der App wählen.
    KI-Kennzeichnung: nicht nötig (historische Gemälde, keine KI-Bilder).
    Stimme: Entwurfsstimme. Für Upload unbedingt eigene Stimme (aufnahme-skript.md) oder bessere Sprecherstimme.

scenes:
  # ---------- HOOK (0–3 s): Gesicht, Punch-In, Gold-Ton
  - text: "Dieser König wollte, dass man ihn bestiehlt."
    hit: true
    mood: gold
    highlight: [bestiehlt]
    visual:
      - {type: photo, src: assets/Friedrich_der_Große_1781_or_1786_-_Google_Art_Project.jpg, from: [0.5, 0.27, 2.3], to: [0.5, 0.3, 1.75], ease: out, rot: [-1.2, 0.4]}
      - {type: dust, n: 30}

  # ---------- DROP + Neugier-Leiste (offene Schleife bis zum Ende)
  - text: "Er stellte Soldaten an ein Kartoffelfeld. Mit dem Befehl, die Diebe durchzulassen."
    transition: whip
    highlight: [Diebe]
    slides:
      - {src: assets/Robert_Warthmüller_-_Der_König_überall_1886_.jpg, from: [0.36, 0.40, 1.85], to: [0.355, 0.42, 1.5], ease: out}
      - {src: assets/Robert_Warthmüller_-_Der_König_überall_1886_.jpg, from: [0.47, 0.38, 2.6], to: [0.45, 0.4, 2.2]}
    visual:
      - {type: teaser, text: "Am Ende: was bis heute auf seinem Grab liegt", y: 0.17, at: 0.6, until: 4.2}

  - text: "Klingt verrückt? Aber Preußen hatte damals ein echtes Problem: Hunger."
    transition: burn
    mood: sad
    highlight: [Hunger]
    slides:
      - {src: assets/Van_Gogh_-_Die_Kartoffelesser.jpg, from: [0.25, 0.5, 1.05], to: [0.32, 0.5, 1.15]}
      - {src: assets/Van_Gogh_-_Die_Kartoffelesser.jpg, from: [0.22, 0.4, 2.2], to: [0.24, 0.42, 2.5]}
    visual:
      - {type: date, text: "Preußen · 18. Jahrhundert", y: 0.09, at: 0.2}
      - {type: fog, strength: 0.28}

  - text: "Missernten trafen das Land immer wieder. Dabei wuchs die Rettung längst in Europa: die Kartoffel."
    mood: warm
    highlight: [Kartoffel]
    slides:
      - {src: assets/Jean-François_Millet_-_Potato_Planters_-_Google_Art_Project.jpg, from: [0.35, 0.5, 1.0], to: [0.42, 0.52, 1.15], rot: [0.6, -0.3]}
      - {src: assets/Jean-François_Millet_-_Potato_Planters_-_Google_Art_Project.jpg, from: [0.6, 0.62, 2.6], to: [0.6, 0.62, 3.2]}
      - {src: assets/Robert_Warthmüller_-_Der_König_überall_1886_.jpg, from: [0.6, 0.86, 2.4], to: [0.56, 0.8, 2.1]}

  # ---------- EMOTION: Dialog des Bauern
  - text: "Nur: Die Bauern trauten ihr nicht. Für sie war das Viehfutter."
    transition: whip
    mood: sad
    visual:
      - {type: photo, src: assets/Van_Gogh_-_Die_Kartoffelesser.jpg, from: [0.62, 0.45, 1.3], to: [0.7, 0.42, 1.5]}
      - {type: dialog, who: "Ein Bauer", text: "Was der Bauer nicht kennt, das frisst er nicht.", src: assets/Van_Gogh_-_Die_Kartoffelesser.jpg, crop: [0.66, 0.36, 5.0], emotion: angry, y: 0.5, at_word: Bauern, note: "Sprichwort"}

  # ---------- B-Roll: Objekte aus Friedrichs Zeit
  - text: "Friedrich der Große erließ Befehl um Befehl. Fünfzehn sind bekannt, der berühmteste vom 24. März 1756."
    say: "Friedrich der Große erließ Befehl um Befehl. Fünfzehn sind bekannt, der berühmteste vom vierundzwanzigsten März siebzehnhundertsechsundfünfzig."
    transition: zoom
    mood: gold
    highlight: [Fünfzehn]
    slides:
      - {src: assets/Friedrich_der_Große_1781_or_1786_-_Google_Art_Project.jpg, from: [0.5, 0.42, 1.0], to: [0.5, 0.36, 1.15]}
      - {src: assets/Coin_Thaler_Showing_Frederick_the_Great_Met33004.jpg, from: [0.5, 0.53, 1.6], to: [0.5, 0.53, 2.0], rot: [-4, 3]}
      - {src: assets/Medal_Showing_Frederick_the_Great_Met33006.jpg, from: [0.42, 0.5, 1.15], to: [0.4, 0.45, 1.6], rot: [3, -2]}
    visual:
      - {type: count, to: 15, label: "Kartoffelbefehle", at_word: Fünfzehn, y: 0.27, dur: 2.0}
      - {type: lower, text: "Friedrich II.", sub: "König von Preußen · 1740–1786", y: 0.58, at: 0.4, until: 3.0}
      - {type: date, text: "24. März 1756", y: 0.09, at_word: berühmteste}

  # ---------- WENDE: Kino-Balken + Rätsel-Ton
  - text: "Doch Papier überzeugt keinen Bauern. Und hier beginnt die Legende."
    transition: burn
    mood: mystery
    visual:
      - {type: photo, src: assets/Adolph_Menzel_-_Flötenkonzert_Friedrichs_des_Großen_in_Sanssouci_-_Google_Art_Project.jpg, from: [0.3, 0.5, 1.0], to: [0.55, 0.48, 1.12], ease: linear, fallback: {src: assets/Robert_Warthmüller_-_Der_König_überall_1886_.jpg, from: [0.2, 0.45, 1.0], to: [0.75, 0.45, 1.0]}}
      - {type: bars, size: 0.08}
      - {type: fog, strength: 0.3}
      - {type: title, text: "Die Legende", y: 0.4, size: 110, at_word: Legende}

  - text: "Der König lässt ein Feld bepflanzen und streng bewachen."
    transition: flash
    hit: true
    mood: danger
    slides:
      - {src: assets/Robert_Warthmüller_-_Der_König_überall_1886_.jpg, from: [0.4, 0.4, 1.6], to: [0.42, 0.36, 1.85]}
      - {src: assets/Robert_Warthmüller_-_Der_König_überall_1886_.jpg, from: [0.36, 0.24, 3.4], to: [0.36, 0.26, 3.9]}
    visual:
      - {type: bars, size: 0.08}

  # ---------- EMOTION: Dialog eines Wachsoldaten
  - text: "Und die Bauern denken sich: Was so bewacht wird, muss ja was wert sein."
    transition: whip
    mood: warm
    visual:
      - {type: photo, src: assets/Robert_Warthmüller_-_Der_König_überall_1886_.jpg, from: [0.78, 0.42, 1.5], to: [0.7, 0.45, 1.7]}
      - {type: bars, size: 0.08}
      - {type: dialog, who: "Ein Wachsoldat", text: "Befehl vom König: Wir sehen heute Nacht nicht so genau hin.", src: assets/Robert_Warthmüller_-_Der_König_überall_1886_.jpg, crop: [0.47, 0.36, 9.0], emotion: sly, y: 0.52, at_word: bewacht, note: "nachgestellt"}

  - text: "Nachts stehlen sie die Knollen. Die Wachen sehen weg. Genau wie geplant."
    heartbeat: true
    mood: night
    slides:
      - {src: assets/Jean-François_Millet_-_Potato_Planters_-_Google_Art_Project.jpg, night: true, from: [0.6, 0.62, 1.4], to: [0.55, 0.66, 1.7]}
      - {src: assets/Jean-François_Millet_-_Potato_Planters_-_Google_Art_Project.jpg, night: true, from: [0.42, 0.42, 2.4], to: [0.44, 0.45, 2.8], enter: fade}
    visual:
      - {type: bars, size: 0.08}
      - {type: fog, strength: 0.15, color: [150, 160, 190]}
      - {type: spotlight, x: 0.55, y: 0.5, r: 0.32, at: 0.3, dark: 0.5}

  # ---------- AUFLÖSUNG: Stempel, kalter Ton
  - text: "Genial, oder? Nur gibt's dafür keinen einzigen Beleg."
    transition: flash
    hit: true
    mood: cold
    visual:
      - {type: photo, src: assets/Friedrich_der_Große_1781_or_1786_-_Google_Art_Project.jpg, from: [0.5, 0.3, 1.9], to: [0.5, 0.28, 2.15]}
      - {type: stamp, text: "Nicht belegt", y: 0.4, at_word: Beleg}

  - text: "In Frankreich erzählt man fast dieselbe Geschichte, über den Apotheker Antoine Parmentier."
    transition: whip
    visual:
      - {type: photo, src: "assets/François_Dumont_-_Portrait_d'Antoine_Parmentier_(1737-1813),_agronome_et_philanthrope_-_P1504_-_Musée_Carnavalet.jpg", reveal_word: Parmentier, from: [0.5, 0.33, 1.25], to: [0.5, 0.3, 1.45], fallback: {src: assets/Robert_Warthmüller_-_Der_König_überall_1886_.jpg, from: [0.52, 0.42, 1.0], to: [0.56, 0.42, 1.1]}}
      - {type: lower, text: "Antoine Parmentier", sub: "Apotheker · 1737–1813", y: 0.6, at_word: Parmentier}

  # ---------- Versprechen der Neugier-Leiste wird eingelöst: Blur-Reveal
  - text: "Echt ist dagegen das hier: Bis heute legen Besucher Kartoffeln auf sein Grab. Schau mal hin, wenn du in Potsdam bist."
    transition: burn
    mood: gold
    highlight: [Grab]
    visual:
      - {type: photo, src: assets/Robert_Warthmüller_-_Der_König_überall_1886_.jpg, reveal_word: Kartoffeln, from: [0.66, 0.9, 2.6], to: [0.6, 0.88, 2.95]}
      - {type: date, text: "Sanssouci · Potsdam", y: 0.09, at_word: Besucher}
      - {type: stamp, text: "Echt", y: 0.42, color: [196, 154, 62], angle: 7, size: 130, at_word: Grab}

  # ---------- LOOP
  - text: "Ob wahr oder nicht, erzählt wird es bis heute:"
    visual:
      - {type: photo, src: assets/Friedrich_der_Große_1781_or_1786_-_Google_Art_Project.jpg, from: [0.5, 0.36, 1.3], to: [0.5, 0.28, 2.25], ease: inout}
      - {type: title, text: "Legende\noder Wahrheit?", y: 0.15, size: 92}
      - {type: dust, n: 30}

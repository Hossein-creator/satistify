# Historischer Fakt (Format C, Mythos oder Wahrheit): Glaubte man im Mittelalter an eine flache Erde?
# Hook: "Kolumbus musste niemandem beweisen, dass die Erde rund ist." (hook_check 90/100)
# Fakten: en.wikipedia.org/wiki/Myth_of_the_flat_Earth (abgerufen 08.11.2026)
title: "Die Erde war im Mittelalter eine Scheibe? Mythos!"
style: doku
format: short
voice: "eleven:george"
speed: 1.0
era: renaissance
music: {score: epoche, era: renaissance, key: G, drop_scene: 1}
music_db: 21

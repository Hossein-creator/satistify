meta:
  titles:
    - "Die 3 absurdesten Kriege der Geschichte"
    - "38 Minuten, 335 Jahre und ein Schwein: absurde Kriege"
    - "Der kürzeste Krieg der Geschichte dauerte 38 Minuten"
  description: |
    Platz 3: Der „335-jährige Krieg“ zwischen den Niederlanden und den Scilly-Inseln. Kein einziger Schuss, Frieden erst 1986. Ob es je wirklich Krieg war, ist umstritten.
    Platz 2: Der Schweinekrieg von 1859 auf San Juan Island. Einziges Opfer: ein Schwein. Den Streit entschied am Ende Kaiser Wilhelm I.
    Platz 1: Der Britisch-Sansibarische Krieg 1896. Dauer: 38 bis 45 Minuten. Der kürzeste Krieg der Geschichte.
  sources:
    - "Three Hundred and Thirty Five Years' War – en.wikipedia.org (abgerufen 11.11.2026)"
    - "Pig War (1859) – en.wikipedia.org (abgerufen 11.11.2026)"
    - "Anglo-Zanzibar War – en.wikipedia.org (abgerufen 11.11.2026)"
  pinned_comment: "Welcher absurde Krieg fehlt in der Liste?"
  tags: [Geschichte, Krieg, Sansibar, Schweinekrieg, Kurioses, History Fakten]
  keywords: "kürzester Krieg,Schweinekrieg 1859,absurde Kriege"
  thumbnail_time: 0.5

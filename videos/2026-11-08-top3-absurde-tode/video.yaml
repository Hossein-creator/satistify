scenes:
  # ---------- HOOK
  - text: "Dieser König starb auf dem Klo. Und er ist nur Platz 3."
    say: "Dieser König starb auf dem Klo. Und er ist nur Platz drei."
    hit: true
    mood: gold
    highlight: [Klo]
    visual:
      - {type: photo, src: assets/georg2_jervas.jpg, from: [0.5, 0.2, 2.6], to: [0.5, 0.22, 1.9], ease: out, rot: [-1.0, 0.4], fallback: {src: assets/georg2_porzellan_1760.jpg, from: [0.55, 0.3, 2.2], to: [0.55, 0.32, 1.7]}}
      - {type: dust, n: 30}

  - text: "Drei Herrscher, drei absurde Tode."
    transition: whip
    mood: danger
    visual:
      - {type: triptych, src: [assets/georg2_porzellan_1760.jpg, assets/peale_kuchen_1818.jpg, assets/delacroix_attila.jpg], crops: [[0.55, 0.3, 1.4], [0.45, 0.55, 1.3], [0.4, 0.35, 1.6]]}
      - {type: teaser, text: "Platz 1 starb in seiner Hochzeitsnacht", y: 0.1, at: 0.3}

  # ---------- PLATZ 3
  - text: "Platz drei: Georg der Zweite, König von Großbritannien."
    transition: flash
    mood: cinematic
    visual:
      - {type: photo, src: assets/holbein_koenig_tod.jpg, from: [0.5, 0.5, 1.15], to: [0.5, 0.48, 1.3]}
      - {type: spotlight, x: 0.5, y: 0.38, r: 0.45, at: -1, dark: 0.7}
      - {type: title, text: "Platz 3", y: 0.34, size: 170, at: 0.0}
      - {type: counter, text: "Platz 3 / 3"}
      - {type: lower, text: "Georg II.", sub: "König von Großbritannien · 1727–1760", y: 0.8, at_word: Georg}

  - text: "25. Oktober 1760. Er steht wie immer um sechs auf und trinkt eine heiße Schokolade."
    say: "Fünfundzwanzigster Oktober siebzehnhundertsechzig. Er steht wie immer um sechs auf und trinkt eine heiße Schokolade."
    transition: whip
    mood: warm
    highlight: [Schokolade]
    slides:
      - {src: assets/georg2_jervas.jpg, from: [0.5, 0.25, 1.8], to: [0.5, 0.22, 2.1], fallback: {src: assets/georg2_porzellan_1760.jpg, from: [0.55, 0.35, 1.5], to: [0.55, 0.33, 1.7]}}
      - {src: assets/schokoladenkanne_1735.jpg, from: [0.45, 0.5, 1.2], to: [0.45, 0.5, 1.45], reveal_word: Schokolade}
    visual:
      - {type: date, text: "25. Oktober 1760 · London", y: 0.09, at: 0.2}

  - text: "Dann geht er allein auf seinen Nachtstuhl."
    mood: mystery
    visual:
      - {type: photo, src: assets/georg2_porzellan_1760.jpg, from: [0.55, 0.32, 1.9], to: [0.56, 0.3, 2.2]}
      - {type: bars, size: 0.08}

  - text: "Minuten später hört sein Diener einen lauten Schlag. Der König liegt am Boden. Tot."
    transition: flash
    hit: true
    mood: cold
    highlight: [Tot]
    visual:
      - {type: photo, src: assets/holbein_koenig_tod.jpg, from: [0.62, 0.55, 2.6], to: [0.64, 0.55, 3.0]}
      - {type: stamp, text: "Tot", y: 0.42, at_word: Tot}

  - text: "Die Ärzte finden einen Riss in der Hauptschlagader."
    mood: sad
    visual:
      - {type: photo, src: assets/georg2_porzellan_1760.jpg, from: [0.55, 0.45, 1.3], to: [0.55, 0.42, 1.45]}
      - {type: lower, text: "Aortendissektion", sub: "Riss der Hauptschlagader", y: 0.8, at_word: Riss}

  # ---------- PLATZ 2
  - text: "Platz zwei: Adolf Friedrich, König von Schweden."
    transition: flash
    visual:
      - {type: photo, src: assets/holbein_koenig_tod.jpg, from: [0.5, 0.5, 1.2], to: [0.5, 0.48, 1.35]}
      - {type: spotlight, x: 0.5, y: 0.38, r: 0.45, at: -1, dark: 0.7}
      - {type: title, text: "Platz 2", y: 0.34, size: 170, at: 0.0}
      - {type: counter, text: "Platz 2 / 3"}
      - {type: lower, text: "Adolf Friedrich", sub: "König von Schweden · 1751–1771", y: 0.8, at_word: Adolf}

  - text: "1771 soll er sich zu Tode gegessen haben. Hummer, Kaviar, Sauerkraut, Champagner."
    say: "Siebzehnhunderteinundsiebzig soll er sich zu Tode gegessen haben. Hummer, Kaviar, Sauerkraut, Champagner."
    transition: whip
    mood: gold
    highlight: [Hummer]
    slides:
      - {src: assets/adolf_fredrik_pasch.jpg, from: [0.5, 0.25, 1.8], to: [0.5, 0.22, 2.1], fallback: {src: assets/flegel_stillleben.jpg, from: [0.4, 0.6, 1.4], to: [0.42, 0.6, 1.6]}}
      - {src: assets/hummer_stillleben_1650.jpg, from: [0.25, 0.62, 2.4], to: [0.27, 0.62, 2.8]}
      - {src: assets/flegel_stillleben.jpg, from: [0.55, 0.45, 1.3], to: [0.55, 0.45, 1.5]}
    visual:
      - {type: date, text: "Stockholm · 1771", y: 0.09, at: 0.2}

  - text: "Und zum Nachtisch vierzehn Portionen Semla, süße Sahnebrötchen in heißer Milch."
    mood: warm
    highlight: [vierzehn]
    visual:
      - {type: photo, src: assets/peale_kuchen_1818.jpg, from: [0.55, 0.5, 1.6], to: [0.55, 0.48, 1.9]}
      - {type: count, to: 14, label: "Portionen Nachtisch", at_word: vierzehn, y: 0.24, dur: 1.4}

  - text: "Die Wahrheit? Heutige Historiker halten das für Propaganda. Sicher ist nur: Er starb plötzlich."
    transition: flash
    hit: true
    mood: cold
    visual:
      - {type: photo, src: assets/adolf_fredrik_pasch.jpg, from: [0.5, 0.25, 2.0], to: [0.5, 0.24, 2.3], fallback: {src: assets/hummer_stillleben_1650.jpg, from: [0.5, 0.5, 1.2], to: [0.5, 0.5, 1.3]}}
      - {type: stamp, text: "Propaganda", y: 0.42, at_word: Propaganda}

  # ---------- PLATZ 1 (Teaser, dann Schwarzbild-Wucht)
  - text: "Und Platz eins? Der gefürchtetste Krieger seiner Zeit."
    transition: burn
    mood: danger
    visual:
      - {type: photo, src: assets/holbein_koenig_tod.jpg, from: [0.5, 0.5, 1.2], to: [0.5, 0.5, 1.4]}
      - {type: spotlight, x: 0.5, y: 0.38, r: 0.45, at: -1, dark: 0.7}
      - {type: title, text: "Platz 1", y: 0.34, size: 170, at: 0.0}
      - {type: counter, text: "Platz 1 / 3"}

  - text: "Attila, König der Hunnen. Man nannte ihn die Geißel Gottes."
    transition: whip
    hit: true
    mood: danger
    highlight: [Gottes]
    slides:
      - {src: assets/delacroix_attila.jpg, from: [0.42, 0.3, 2.2], to: [0.4, 0.32, 1.7], ease: out}
      - {src: assets/delacroix_attila.jpg, from: [0.5, 0.55, 1.2], to: [0.5, 0.55, 1.35]}
    visual:
      - {type: lower, text: "Attila", sub: "König der Hunnen · um 406–453", y: 0.8, at_word: Attila}

  - text: "453 heiratet er noch einmal. Eine junge Frau namens Ildiko. Es gibt ein riesiges Fest."
    say: "Vierhundertdreiundfünfzig heiratet er noch einmal. Eine junge Frau namens Ildiko. Es gibt ein riesiges Fest."
    mood: gold
    highlight: [Fest]
    slides:
      - {src: assets/than_attila_fest.jpg, from: [0.5, 0.45, 1.0], to: [0.45, 0.45, 1.15]}
      - {src: assets/than_attila_fest.jpg, from: [0.45, 0.35, 2.4], to: [0.46, 0.33, 2.8]}
      - {src: assets/flegel_stillleben.jpg, from: [0.5, 0.35, 1.5], to: [0.5, 0.35, 1.7]}
    visual:
      - {type: date, text: "Pannonien · 453", y: 0.09, at: 0.2}

  - text: "Am Morgen finden sie ihn tot. Vermutlich Nasenbluten im Rausch. Er erstickte am eigenen Blut."
    heartbeat: true
    mood: blood
    highlight: [Blut]
    visual:
      - {type: photo, src: assets/than_attila_fest.jpg, night: true, from: [0.45, 0.3, 2.4], to: [0.45, 0.3, 2.8]}
      - {type: bars, size: 0.08}
      - {type: spotlight, x: 0.5, y: 0.45, r: 0.33, at: 0.2, dark: 0.5}

  # ---------- SCHLUSS + FRAGE
  - text: "Der Mann, vor dem Rom zitterte, starb im Bett. Welcher Tod ist für dich der absurdeste?"
    transition: flash
    mood: gold
    visual:
      - {type: photo, src: assets/delacroix_attila.jpg, from: [0.42, 0.3, 1.4], to: [0.42, 0.28, 2.0], ease: inout}
      - {type: dust, n: 30}

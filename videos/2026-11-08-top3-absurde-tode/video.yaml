  description: |
    Platz 3: Georg II. von Großbritannien starb 1760 kurz nach dem Gang auf den Nachtstuhl (Riss der Hauptschlagader).
    Platz 2: Adolf Friedrich von Schweden soll sich 1771 zu Tode gegessen haben. Heutige Historiker halten das für Propaganda.
    Platz 1: Attila starb 453 in der Nacht nach seiner Hochzeit, vermutlich an Nasenbluten im Rausch.
  sources:
    - "George II of Great Britain – en.wikipedia.org/wiki/George_II_of_Great_Britain (abgerufen 07.11.2026)"
    - "Adolf Frederick of Sweden – en.wikipedia.org/wiki/Adolf_Frederick_of_Sweden (abgerufen 07.11.2026)"
    - "Attila – en.wikipedia.org/wiki/Attila (abgerufen 07.11.2026); Priscus, überliefert bei Jordanes, Getica"
  pinned_comment: "Klo, Sahnebrötchen oder Nasenbluten: Welcher Tod ist für dich der absurdeste?"
  tags: [Geschichte, Top 3, Attila, Georg II, Adolf Friedrich, kuriose Tode, History Fakten]
  keywords: "absurde Tode Geschichte,Attila Tod,Top 3 Geschichte"

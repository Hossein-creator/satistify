    - "Diese Zitate sind falsch: Voltaire, Galilei, Marie Antoinette"
    - "Die berühmtesten falschen Zitate der Geschichte"
  description: |
    Platz 3: „Ich missbillige, was Sie sagen …“ stammt nicht von Voltaire, sondern von Evelyn Beatrice Hall (1906).
    Platz 2: „Und sie bewegt sich doch“ ist erst 1757 gedruckt belegt, über 100 Jahre nach Galileis Prozess.
    Platz 1: „Dann sollen sie Kuchen essen“ steht bei Rousseau über eine namenlose Prinzessin, geschrieben, als Marie Antoinette noch ein Kind in Wien war.

  - text: "Klingt nach Voltaire. Geschrieben hat es aber eine Engländerin, 1906, in einem Buch über ihn. Evelyn Beatrice Hall."
    say: "Klingt nach Voltaire. Geschrieben hat es aber eine Engländerin, neunzehnhundertsechs, in einem Buch über ihn. Evelyn Beatrice Hall."
    transition: flash
    hit: true
    mood: cold
    visual:

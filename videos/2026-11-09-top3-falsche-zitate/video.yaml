  # ---------- PLATZ 3
  - text: "Platz drei: Voltaire."
    transition: flash
    visual:
      - {type: photo, src: assets/tintenfass_1770.jpg, from: [0.5, 0.5, 1.2], to: [0.5, 0.5, 1.35]}

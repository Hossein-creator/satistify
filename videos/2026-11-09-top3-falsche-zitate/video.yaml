      - {type: dialog, who: "Galileo Galilei?", text: "Und sie bewegt sich doch.", src: assets/galilei_villamena_1623.jpg, crop: [0.5, 0.45, 3.5], emotion: sly, y: 0.48, at_word: gemurmelt, note: "angeblich"}

  - text: "Nur: Seine erste Biografie kennt den Satz nicht. Gedruckt erscheint er erst 1757. In London."
    say: "Nur: Seine erste Biografie kennt den Satz nicht. Gedruckt erscheint er erst siebzehnhundertsiebenundfünfzig. In London."
    transition: flash
    hit: true
    mood: cold
    visual:
      - {type: photo, src: assets/galilei_villamena_1623.jpg, from: [0.5, 0.45, 1.6], to: [0.5, 0.45, 1.8]}
      - {type: stamp, text: "Nicht belegt", y: 0.42, at_word: Biografie}
      - {type: count, to: 124, label: "Jahre später", at_word: Gedruckt, y: 0.24, dur: 1.4}

  # ---------- PLATZ 1
  - text: "Und Platz eins? Der berühmteste Satz der Französischen Revolution."
    transition: burn
    mood: danger
    visual:
      - {type: photo, src: assets/tintenfass_1770.jpg, from: [0.5, 0.5, 1.3], to: [0.5, 0.5, 1.5]}
      - {type: spotlight, x: 0.5, y: 0.38, r: 0.45, at: -1, dark: 0.7}
      - {type: title, text: "Platz 1", y: 0.34, size: 170, at: 0.0}
      - {type: counter, text: "Platz 1 / 3"}

  - text: "Marie Antoinette. Das Volk hat kein Brot. Ihre Antwort: Dann sollen sie doch Kuchen essen."
    transition: whip
    hit: true
    mood: gold
    highlight: [Kuchen]
    slides:

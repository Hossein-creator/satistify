  - text: "Als er das schrieb, lebte Marie Antoinette noch in Wien. Sie war ein Kind. Nach Frankreich kam sie erst mit 14."
    say: "Als er das schrieb, lebte Marie Antoinette noch in Wien. Sie war ein Kind. Nach Frankreich kam sie erst mit vierzehn."
    transition: flash
    hit: true
    mood: cold
    visual:
      - {type: photo, src: assets/marie_antoinette_1770.jpg, from: [0.5, 0.42, 1.8], to: [0.5, 0.4, 2.1]}
      - {type: stamp, text: "Nie gesagt", y: 0.42, at_word: Kind}

  - text: "Welches falsche Zitat kennst du noch?"

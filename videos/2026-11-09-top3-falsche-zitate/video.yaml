      - {type: title, text: "Platz 3", y: 0.34, size: 170, at: 0.0}
      - {type: counter, text: "Platz 3 / 3"}

  - text: "Ich missbillige, was Sie sagen, aber ich werde bis zum Tod Ihr Recht verteidigen, es zu sagen."
    transition: whip
    mood: warm
    visual:
      - {type: photo, src: assets/houdon_voltaire_1778.jpg, from: [0.5, 0.3, 1.8], to: [0.5, 0.28, 2.1]}

      - {type: title, text: "Platz 2", y: 0.34, size: 170, at: 0.0}
      - {type: counter, text: "Platz 2 / 3"}

  - text: "1633 muss er vor der Inquisition abschwören. Danach soll er gemurmelt haben: Und sie bewegt sich doch."
    say: "Sechzehnhundertdreiunddreißig muss er vor der Inquisition abschwören. Danach soll er gemurmelt haben: Und sie bewegt sich doch."
    transition: whip
    mood: mystery
    slides:
      - {src: assets/galilei_dialogo_1632.jpg, from: [0.5, 0.6, 1.3], to: [0.5, 0.58, 1.5]}
      - {src: assets/galilei_villamena_1623.jpg, from: [0.5, 0.45, 2.0], to: [0.5, 0.43, 2.3]}
    visual:

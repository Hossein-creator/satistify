      - {type: lower, text: "Evelyn Beatrice Hall", sub: "The Friends of Voltaire · 1906", y: 0.78, at_word: Evelyn}

  # ---------- PLATZ 2
  - text: "Platz zwei: Galileo Galilei."
    transition: flash
    visual:
      - {type: photo, src: assets/tintenfass_1770.jpg, from: [0.5, 0.5, 1.25], to: [0.5, 0.5, 1.4]}

# Historischer Fakt (Format C, Mythos oder Wahrheit): Nero spielte, während Rom brannte?
# Hook: "Rom brannte, aber Nero war gar nicht in der Stadt." (hook_check 80/100)
# Fakten: en.wikipedia.org/wiki/Great_Fire_of_Rome (abgerufen 11.11.2026); Violine: erst 16. Jh. (en.wikipedia.org/wiki/Violin)
title: "Nero spielte, während Rom brannte? Mythos!"
style: doku
format: short
voice: "piper:thorsten-tief"
speed: 1.0
era: antike
music: {score: epoche, era: antike, key: A, drop_scene: 1}
music_db: 21
duck: 0.5
beat_bump: 0.006
handheld: 0.7
leaks: 0.08
